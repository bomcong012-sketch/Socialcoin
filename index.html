<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사회코인 BANK · 프로토타입</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
:root{font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:#25443f;background:#f9f7f0}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:#176e63;color:white;font-weight:700}button:hover{filter:brightness(.95)}button:disabled{opacity:.45;cursor:default}.outline{border:1px solid #acc8bf;background:white;color:#24665d}.danger{background:#be625d}.quiet{background:#eee9dc;color:#34534d}.app{max-width:1180px;margin:auto;padding:20px}.header{display:flex;align-items:center;gap:14px;padding:8px 0 18px}.header img{width:72px;height:72px;object-fit:contain}.header h1{font-size:26px;margin:0}.muted{color:#71847e;font-size:13px}.pill{margin-left:auto;border-radius:99px;background:#fff0d3;color:#9a6b24;padding:8px 13px;font-size:12px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 17px}.nav button{background:#e5efea;color:#2c635a}.nav button.active{background:#176e63;color:#fff}.panel{background:white;border:1px solid #e8e8dd;border-radius:20px;padding:22px;margin-bottom:15px;box-shadow:0 7px 25px #274c3d0b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stat{background:#ecf5f0;border-radius:14px;padding:18px}.stat b{display:block;font-size:27px;margin-top:7px}h2{margin:0 0 13px;font-size:21px}h3{margin:0 0 10px}p{line-height:1.6}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:9px 0}.field{border:1px solid #d4dfd8;background:white;border-radius:11px;padding:11px;min-width:120px;max-width:100%}input[type=number]{width:120px}.hidden{display:none!important}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e9eee9;padding:11px 8px;font-size:14px}th{background:#f5f8f5}td button{padding:7px 10px;font-size:12px}.success{color:#238460}.negative{color:#be625d}.notice{border-radius:12px;background:#fff6e4;color:#76542e;padding:12px;font-size:13px;line-height:1.5}.selection{padding:12px;border-radius:12px;background:#eef7f2;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.print-card{border:1.5px dashed #a5b5ae;border-radius:9px;padding:10px;background:#fff;break-inside:avoid;color:#203c38;min-height:290px}.card-head{display:flex;align-items:center;gap:6px}.card-head img{width:42px;height:42px;object-fit:contain}.card-head strong{font-size:14px}.codes{display:flex;gap:12px;align-items:center;justify-content:space-between}.bar-stack{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.barcode svg{width:100%;max-height:79px}.barcode{width:100%;text-align:center;min-width:0}.barcode small{display:block;font-size:11px;font-weight:700}.qr{width:70px;height:70px;flex-shrink:0}.qr img,.qr canvas{width:70px!important;height:70px!important}.student-box{max-width:450px;margin:26px auto;text-align:center}.student-box img.logo{width:126px;height:126px;object-fit:contain}.big{font-size:50px;font-weight:800;color:#176e63}.scanner{max-width:420px}#reader{max-width:390px}.right{margin-left:auto}.scanlog{max-height:170px;overflow:auto}.footer{padding:18px 0 28px;text-align:center;color:#82968d;font-size:12px}@media(max-width:680px){.grid,.cards{grid-template-columns:1fr}.app{padding:12px}.panel{padding:14px}.header img{width:55px;height:55px}.header h1{font-size:22px}.pill{display:none}}@media print{@page{size:A4;margin:8mm}body{background:white}.nonprint,.header,.nav,.footer{display:none!important}.app{padding:0;max-width:none}.panel{border:0;box-shadow:none;padding:0;margin:0}.cards{grid-template-columns:repeat(2,1fr);gap:4mm}.print-card{height:83mm;min-height:0;padding:3mm}.card-head img{width:10mm;height:10mm}.barcode svg{max-height:22mm}.qr,.qr img,.qr canvas{width:20mm!important;height:20mm!important}.print-only{display:block!important}}
body.student-view .pill{display:none}body.student-view .header{justify-content:center}body.student-view .header h1{font-size:23px}body.student-view .footer{max-width:460px;margin:auto;text-align:center}.wallet-entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e8eee9}.wallet-entry strong{font-size:14px}.wallet-entry .muted{font-size:12px;margin-top:4px}</style></head><body><div class="app"><header class="header nonprint"><img src="coin-logo.png" alt="사회코인 로고"><div><div class="muted">우리 반의 작은 경제생활</div><h1>사회코인 BANK</h1></div><span class="pill">로컬 체험판 · 서버 미연결</span></header><nav id="nav" class="nav nonprint"></nav><main id="main"></main><div class="footer nonprint">이 체험판은 이 브라우저에만 데이터를 저장합니다. 실제 학생 개인정보를 입력하지 마세요.</div></div><script>
'use strict';const STORE='socialcoin_bank_proto_v1';let db=load(),tab='dashboard',studentSession=null,scanMode='add',scanAmount=1,scanStudent='',scanLogs=[],camera=null,heldScans=new Map(),cardPage=0,cardClass='all';const $=id=>document.getElementById(id);function load(){try{return JSON.parse(localStorage.getItem(STORE))||{students:[],transactions:[]}}catch{return{students:[],transactions:[]}}}function save(){localStorage.setItem(STORE,JSON.stringify(db))}function shortCode(){let v;do{v=String(Math.floor(10000000+Math.random()*90000000))}while(db.students.some(s=>s.scanCode===v));return v}for(const s of db.students){if(!s.scanCode)s.scanCode=shortCode()}save();function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function id(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-5)}function pin(){return String(Math.floor(100000+Math.random()*900000))}function token(){return 'S'+id().toUpperCase()}function example(){db={students:[{id:id(),grade:3,cls:7,num:1,name:'김○○',balance:12,pin:'123456',code:token(),scanCode:shortCode()},{id:id(),grade:3,cls:7,num:2,name:'이○○',balance:8,pin:'123456',code:token(),scanCode:shortCode()},{id:id(),grade:3,cls:7,num:3,name:'박○○',balance:20,pin:'123456',code:token(),scanCode:shortCode()}],transactions:[]};save();render()}function byCode(c){let code=(c||'').trim().toUpperCase();return db.students.find(s=>s.code===code.replace(/^[+-]/,'')||s.id===code)}function bar(s,type){return (type==='add'?'1':'2')+s.scanCode}function fmt(s){return `${s.grade}학년 ${s.cls}반 ${s.num}번 · ${esc(s.name)}`}function money(n){return Number(n||0).toLocaleString('ko-KR')}function transact(s,amount,reason){if(!s)return {error:'학생을 찾을 수 없습니다.'};if(!Number.isSafeInteger(amount)||amount===0||Math.abs(amount)>10000)return {error:'적립·차감 수량이 올바르지 않습니다.'};if(s.balance+amount<0)return {error:`잔액 부족 (현재 ${s.balance}코인)`};let before=s.balance;s.balance+=amount;db.transactions.unshift({id:id(),studentId:s.id,amount,reason:reason||'직접 입력',before,after:s.balance,at:new Date().toISOString()});save();return {ok:true,after:s.balance}}
function nav(){let student=location.hash.startsWith('#wallet');$('nav').innerHTML=student?'':([['dashboard','대시보드'],['students','학생 관리'],['scan','바코드 스캔'],['cards','카드 출력'],['transactions','거래 내역']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')+'<button class="quiet right" onclick="location.hash=\'#wallet\';render()">학생 통장 체험</button>')}
function go(t){stopCamera();tab=t;render()}function render(){nav();let student=location.hash.startsWith('#wallet');document.body.classList.toggle('student-view',student);$('main').innerHTML=student?wallet():tab==='dashboard'?dashboard():tab==='students'?students():tab==='scan'?scan():tab==='cards'?cards():transactions();if(tab==='cards'&&!student)drawCodes();if(tab==='scan'&&!student)scanFocus()}function dashboard(){return `<section class="panel"><h2>사회코인 현황</h2><div class="grid"><div class="stat">등록 학생<b>${money(db.students.length)}명</b></div><div class="stat">전체 코인 잔액<b>${money(db.students.reduce((a,s)=>a+s.balance,0))}</b></div><div class="stat">거래 기록<b>${money(db.transactions.length)}건</b></div></div></section><section class="panel"><h2>시작하기</h2><p>엑셀 명단을 등록하면 학생별 통장과 바코드·QR 카드가 만들어집니다. 이 체험판에서는 샘플 학생으로 흐름을 테스트할 수 있습니다.</p><div class="row"><button onclick="go('students')">학생 명단 등록</button><button class="outline" onclick="go('scan')">바코드 스캔</button><button class="outline" onclick="go('cards')">카드 출력</button><button class="quiet" onclick="example()">가상 학생 3명 채우기</button></div><div class="notice">중요: 이 버전은 기능 검증용 로컬 프로토타입입니다. 교사 인증·서버 권한 검증·기기 간 동기화가 없으므로 실제 학생 명단으로 운영하지 마세요. 실제 사용 전 Supabase 연결과 보안 구성이 필요합니다.</div></section>`}
function students(){return `<section class="panel"><h2>학생 명단 업로드</h2><p class="muted">열 이름: 학년, 반, 번호, 이름, 초기코인 / CSV·XLSX 지원. 기존 학생은 덮어쓰지 않고 건너뜁니다.</p><div class="row"><button class="outline" onclick="template()">엑셀 양식 다운로드</button><input id="file" type="file" accept=".xlsx,.xls,.csv" class="field"><button onclick="upload()">명단 불러오기</button></div><div id="upload-result" class="notice">가상 학생 데이터로 먼저 시험해 보세요.</div></section><section class="panel"><h2>학생별 통장 (${db.students.length}명)</h2><div class="row"><input id="search" class="field" placeholder="학생 이름·학번 검색" oninput="filterStudents()"><button class="quiet" onclick="example()">가상 학생으로 초기화</button><button class="danger" onclick="clearAll()">로컬 데이터 전체 삭제</button></div><div style="overflow-x:auto"><table><thead><tr><th>학생</th><th>잔액</th><th>수동 수정</th><th>카드 확인</th></tr></thead><tbody id="student-rows">${db.students.map(s=>studentRow(s)).join('')}</tbody></table></div></section>`}
function studentRow(s){return `<tr data-search="${esc((s.name+' '+s.grade+' '+s.cls+' '+s.num).toLowerCase())}"><td>${fmt(s)}</td><td><b>${money(s.balance)}</b></td><td><button class="outline" onclick="manual('${s.id}',1)">+1</button> <button class="outline" onclick="manual('${s.id}',-1)">−1</button></td><td><button class="outline" onclick="go('cards')">인쇄</button></td></tr>`}function filterStudents(){let q=$('search').value.toLowerCase();document.querySelectorAll('#student-rows tr').forEach(x=>x.style.display=x.dataset.search.includes(q)?'':'none')}
function manual(sid,a){let s=db.students.find(x=>x.id===sid);let r=transact(s,a,'교사 직접 조정');if(r.error)alert(r.error);render()}function clearAll(){if(confirm('현재 브라우저에 저장된 모든 학생·거래 데이터를 삭제할까요?')){db={students:[],transactions:[]};save();render()}}
function template(){let rows=[['학년','반','번호','이름','초기코인'],[3,7,1,'가상학생A',12],[3,7,2,'가상학생B',8]];let csv='\uFEFF'+rows.map(r=>r.join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'사회코인_학생명단_양식.csv')}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function upload(){let f=$('file').files[0];if(!f)return alert('파일을 선택하세요.');try{let rows;if(/\.csv$/i.test(f.name)){let text=await f.text();if(typeof XLSX!=='undefined'){rows=XLSX.utils.sheet_to_json(XLSX.read(text,{type:'string'}).Sheets.Sheet1,{defval:''})}else{throw Error('엑셀 파서 로딩 실패 (인터넷 연결 확인)')}}else{if(typeof XLSX==='undefined')throw Error('엑셀 파서 로딩 실패');let workbook=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{defval:''})}let count=0,skipped=0;for(let r of rows){let grade=Number(r['학년']),cls=Number(r['반']),num=Number(r['번호']),name=String(r['이름']||'').trim(),balance=Number(r['초기코인']??0);if(!Number.isInteger(grade)||!Number.isInteger(cls)||!Number.isInteger(num)||!name||!Number.isSafeInteger(balance)||balance<0){skipped++;continue}if(db.students.some(s=>s.grade===grade&&s.cls===cls&&s.num===num)){skipped++;continue}db.students.push({id:id(),grade,cls,num,name,balance,pin:pin(),code:token(),scanCode:shortCode()});count++}save();render();alert(`신규 등록 ${count}명 / 중복·오류 ${skipped}명. 초기 비밀번호는 카드 출력 탭의 별도 안내지에서 확인할 수 있습니다.`)}catch(e){alert('업로드 실패: '+e.message)}}
function scan(){return `<section class="panel"><h2>빠른 바코드 스캔</h2><div class="notice">실제 운영에서는 교사 로그인 후에만 스캔 거래가 가능하도록 보호해야 합니다. 현재는 기능 시연 모드입니다.</div><div class="row"><label><input type="radio" name="mode" value="add" ${scanMode==='add'?'checked':''} onchange="scanMode='add';render()"> + 적립</label><label><input type="radio" name="mode" value="deduct" ${scanMode==='deduct'?'checked':''} onchange="scanMode='deduct';render()"> − 차감</label></div><div class="row"><label for="scan-amount">스캔당 수량</label><select id="scan-amount" class="field" onchange="scanAmount=Number(this.value)">${[1,2,3,5,10].map(n=>`<option value="${n}" ${scanAmount===n?'selected':''}>${n}코인</option>`).join('')}</select><input id="scan-reason" class="field" placeholder="거래 사유 (선택)"></div><div class="selection"><strong>${scanMode==='add'?'초록 적립':'분홍 차감'} 바코드만 인식합니다.</strong><div class="muted">스캐너 입력창을 클릭한 뒤 스캔하세요. 1로 시작하는 9자리 값은 적립, 2로 시작하는 9자리 값은 차감입니다. 값만 입력되고 처리되지 않으면 Enter 키를 누르세요.</div></div><div class="row"><input id="scan-input" class="field" style="flex:1" inputmode="none" autocomplete="off" placeholder="바코드를 스캔하면 자동 인식 (Enter 없어도 처리)" oninput="scanInputChanged(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();submitScan(this.value)}"><button class="outline" onclick="submitScan($('scan-input').value)">처리</button><button class="outline" onclick="cameraStart()">카메라 켜기</button><button class="quiet" onclick="stopCamera()">카메라 끄기</button></div><div class="notice" id="scan-diagnostics">USB 연결 확인: 먼저 Windows 메모장에서 바코드를 찍어 숫자가 입력되는지 확인하세요. 웹앱은 바코드 입력창 자동 포커스·Enter 없는 자동 처리·키보드 입력 감지를 지원합니다.</div><div id="reader" class="scanner"></div><div id="scan-result" class="selection">아직 처리된 거래가 없습니다.</div><h3>최근 처리 결과</h3><div id="scan-log" class="scanlog">${scanLogs.map(x=>`<p>${esc(x)}</p>`).join('')}</div></section>`}function scanFocus(){setTimeout(()=>{const x=$('scan-input');if(x){x.focus();setDiagnostic('입력 대기 중 · 스캐너로 바코드를 읽어 주세요.')}} ,100)}
let scanInputTimer=null, keyboardStream='', lastKeystroke=0;
function setDiagnostic(v){const el=$('scan-diagnostics');if(el)el.textContent=v}
function submitScan(v){clearTimeout(scanInputTimer);const raw=String(v||'').replace(/[\r\n\t ]/g,'').trim();if(!raw)return;setDiagnostic('스캐너 입력 확인: '+raw+' / 길이 '+raw.length+'자리');handleScan(raw);const field=$('scan-input');if(field){field.value='';field.focus()}}
function scanInputChanged(v){clearTimeout(scanInputTimer);const cleaned=String(v||'').replace(/[\r\n\t ]/g,'');setDiagnostic(cleaned?'입력 감지: '+cleaned+' ('+cleaned.length+'자리)':'입력 대기 중');if(/^[12]\d{8}$/.test(cleaned)||/^[+-]S[A-Z0-9]+$/i.test(cleaned)){scanInputTimer=setTimeout(()=>submitScan(cleaned),220)}}
document.addEventListener('keydown',function(event){if(tab!=='scan'||location.hash.startsWith('#wallet')||event.ctrlKey||event.altKey||event.metaKey||event.isComposing)return;const target=event.target;const editable=target&&((target.tagName==='INPUT'&&target.id!=='scan-input')||target.tagName==='TEXTAREA'||target.tagName==='SELECT'||target.isContentEditable);if(editable)return;const field=$('scan-input');if(!field)return;if(event.key==='Enter'){if(document.activeElement!==field&&keyboardStream){event.preventDefault();submitScan(keyboardStream);keyboardStream=''}return}if(event.key.length!==1)return;const now=Date.now();if(now-lastKeystroke>700)keyboardStream='';lastKeystroke=now;if(document.activeElement!==field){keyboardStream+=event.key;if(keyboardStream.length>80)keyboardStream=keyboardStream.slice(-80);if(/^[12]\d{8}$/.test(keyboardStream)){event.preventDefault();submitScan(keyboardStream);keyboardStream=''}else setDiagnostic('키보드 입력 감지: '+keyboardStream)}});
function handleScan(raw){let code=String(raw||'').trim().toUpperCase(),expected=scanMode==='add'?'1':'2';if(!code)return;let modern=/^[12]\d{8}$/.test(code),legacy=/^[+-]S[A-Z0-9]+$/.test(code);if(!modern&&!legacy){scanResult('읽힌 값: '+code+' / 사회코인 카드 코드가 아닙니다. 카드 출력에서 새로 인쇄했는지 확인해 주세요.',false);return}let isAdd=modern?code[0]==='1':code[0]==='+';if(isAdd!==(scanMode==='add')){scanResult('읽힌 바코드 종류가 현재 적립·차감 모드와 다릅니다. 읽힌 값: '+code,false);return}let s=modern?db.students.find(x=>x.scanCode===code.slice(1)):byCode(code);if(!s){scanResult('등록되지 않은 바코드입니다. 읽힌 값: '+code+' / 이 브라우저에 학생이 등록됐는지 확인하세요.',false);return}let now=Date.now();if(now-(heldScans.get(code)||0)<2500){scanResult('중복 스캔 차단: 잠시 후 다시 시도하세요.',false);return}let amount=scanAmount*(scanMode==='add'?1:-1),reason=$('scan-reason')?.value.trim()||(scanMode==='add'?'바코드 적립':'바코드 차감');let r=transact(s,amount,reason);if(r.error){scanResult(r.error,false);return}heldScans.set(code,now);let msg=`${fmt(s)} · ${amount>0?'+':''}${amount}코인 · 잔액 ${r.after}`;scanLogs.unshift(msg);scanLogs=scanLogs.slice(0,8);scanResult(msg,true);$('scan-log').innerHTML=scanLogs.map(x=>`<p>${esc(x)}</p>`).join('');if($('scan-input')){$('scan-input').value='';$('scan-input').focus()}}
function scanResult(t,ok){if($('scan-result'))$('scan-result').innerHTML=`<strong class="${ok?'success':'negative'}">${ok?'✓ ':'⚠ '}${esc(t)}</strong>`}async function cameraStart(){if(camera)return;try{if(typeof Html5Qrcode==='undefined')throw Error('카메라 라이브러리를 불러오지 못했습니다.');camera=new Html5Qrcode('reader');await camera.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},(decoded)=>handleScan(decoded),()=>{})}catch(e){alert('카메라 시작 실패: '+e.message);camera=null}}async function stopCamera(){if(camera){let x=camera;camera=null;try{await x.stop();x.clear()}catch{}}}
function cardStudents(){return cardClass==='all'?db.students:db.students.filter(s=>`${s.grade}-${s.cls}`===cardClass)}
function changeCardClass(v){cardClass=v;cardPage=0;render()}
function changeCardPage(d){const total=Math.max(1,Math.ceil(cardStudents().length/8));cardPage=Math.max(0,Math.min(total-1,cardPage+d));render()}
function cards(){const items=cardStudents(),pages=Math.max(1,Math.ceil(items.length/8));cardPage=Math.min(cardPage,pages-1);const shown=items.slice(cardPage*8,(cardPage+1)*8),classes=[...new Set(db.students.map(s=>`${s.grade}-${s.cls}`))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return `<section class="panel"><div class="row nonprint"><h2>학생 카드 인쇄</h2><button class="right" onclick="window.print()">현재 8장 인쇄 / PDF 저장</button><button class="outline" onclick="passwordSheet()">초기 비밀번호 안내지</button></div><p class="muted nonprint">속도 개선: 204명 전부 한꺼번에 생성하지 않고 한 번에 최대 8명의 카드만 표시합니다. 인쇄는 현재 페이지의 카드만 출력합니다. QR·바코드 인쇄 후 실제 인식 여부를 확인해 주세요.</p><div class="row nonprint"><label for="card-class">학급 선택</label><select id="card-class" class="field" onchange="changeCardClass(this.value)"><option value="all" ${cardClass==='all'?'selected':''}>전체 학급 (${db.students.length}명)</option>${classes.map(c=>`<option value="${c}" ${cardClass===c?'selected':''}>${c.replace('-', '학년 ')}반</option>`).join('')}</select><span class="muted">대상 ${items.length}명 · ${cardPage+1}/${pages}페이지</span><button class="outline" onclick="changeCardPage(-1)" ${cardPage===0?'disabled':''}>이전 8명</button><button class="outline" onclick="changeCardPage(1)" ${cardPage>=pages-1?'disabled':''}>다음 8명</button></div><div class="cards">${shown.map(s=>`<article class="print-card"><div class="card-head"><img src="coin-logo.png" alt=""><div><strong>사회코인 BANK</strong><div style="font-size:12px">${fmt(s)}</div></div></div><div class="codes"><div class="bar-stack"><div class="barcode"><small style="color:#207858">+ 적립</small><svg id="bar-add-${s.id}"></svg></div><div class="barcode"><small style="color:#b35a50">− 차감</small><svg id="bar-deduct-${s.id}"></svg></div></div><div class="qr" id="qr-${s.id}"></div></div><div style="font-size:10px;text-align:center;color:#63756b">초록: 적립 | 분홍: 차감 | QR: 나의 통장 조회</div></article>`).join('')}</div>${items.length?'':'<p>해당 학급에 학생이 없습니다.</p>'}</section>`}
function drawCodes(){const selected=cardStudents().slice(cardPage*8,(cardPage+1)*8);for(const s of selected){try{if(typeof JsBarcode!=='undefined'){JsBarcode(`#bar-add-${s.id}`,bar(s,'add'),{format:'CODE128',displayValue:true,fontSize:11,textMargin:3,width:2,height:48,margin:12});JsBarcode(`#bar-deduct-${s.id}`,bar(s,'deduct'),{format:'CODE128',displayValue:true,fontSize:11,textMargin:3,width:2,height:48,margin:12})}if(typeof QRCode!=='undefined'){const url=new URL('bank-online.html',location.href);url.searchParams.set('code',s.code);new QRCode($('qr-'+s.id),{text:url.toString(),width:70,height:70,correctLevel:QRCode.CorrectLevel.M})}}catch(e){console.warn('카드 코드 생성 오류',e)}}}
function passwordSheet(){let w=window.open('','_blank');if(!w)return alert('팝업을 허용해 주세요.');w.document.write(`<html lang="ko"><head><meta charset="utf-8"><title>초기 비밀번호 안내</title><style>body{font-family:sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:9px}</style></head><body><h2>사회코인 BANK 초기 비밀번호 안내 (교사용)</h2><p>실제 운영에는 이 데모 비밀번호 방식 대신 서버 인증을 구현해야 합니다. 학생별로 분리해 전달하세요.</p><table><tr><th>학생</th><th>초기 비밀번호</th></tr>${db.students.map(s=>`<tr><td>${fmt(s)}</td><td>${esc(s.pin)}</td></tr>`).join('')}</table></body></html>`);w.document.close()}
function wallet(){
  let code=decodeURIComponent(location.hash.split('/')[1]||'');
  let s=byCode(code);
  if(!s)return `<section class="panel student-box"><h2>나의 사회코인 통장</h2><div class="notice">이 버전은 교사 PC의 브라우저에 저장된 데이터를 사용합니다. 다른 휴대전화에서는 학생의 정보를 확인할 수 없습니다. 실제 기기 간 조회에는 서버 연결이 필요합니다.</div><p>학생 카드를 스캔했는데 이 화면이 보이나요? 교사에게 서버 연결 여부를 문의하세요.</p></section>`;
  if(studentSession!==s.id)return `<section class="panel student-box"><h2>나의 사회코인 통장</h2><p>${fmt(s)}</p><p class="muted">카드에 안내된 개인 비밀번호를 입력하세요.</p><input type="password" id="pin-input" class="field" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="개인 비밀번호" onkeydown="if(event.key==='Enter')login('${s.id}')"><div class="row" style="justify-content:center"><button onclick="login('${s.id}')">통장 열기</button></div><p class="notice">현재 로컬 체험판입니다. 실제 학생 개인정보를 등록하거나 공유하지 마세요.</p></section>`;
  let tx=db.transactions.filter(t=>t.studentId===s.id);
  let earned=tx.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),spent=tx.filter(t=>t.amount<0).reduce((a,t)=>a-t.amount,0);
  let months=[...new Set(tx.map(t=>String(t.at).slice(0,7)))].sort().reverse();
  let month=window.walletSelectedMonth||'all';
  if(month!=='all'&&!months.includes(month)){month='all';window.walletSelectedMonth='all'}
  let visible=tx.filter(t=>month==='all'||String(t.at).slice(0,7)===month);
  let items=visible.slice(0,50).map(t=>`<div class="wallet-entry"><div><strong>${esc(t.reason||'수업 활동')}</strong><div class="muted">${new Date(t.at).toLocaleString('ko-KR',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div><div style="text-align:right"><b class="${t.amount>0?'success':'negative'}">${t.amount>0?'+':''}${money(t.amount)} 코인</b><div class="muted">잔액 ${money(t.after)}</div></div></div>`).join('');
  return `<section class="panel student-box" style="text-align:left;max-width:550px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">나의 사회코인 통장</h2><button class="quiet" onclick="studentSession=null;window.walletSelectedMonth='all';render()">로그아웃</button></div><p class="muted">${fmt(s)}</p><div class="stat" style="text-align:center"><div>현재 보유 코인</div><div class="big">${money(s.balance)}</div><div class="muted">교사 브라우저 저장 기준</div></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px"><div class="stat" style="text-align:center">누적 적립<b class="success" style="font-size:23px">+${money(earned)}</b></div><div class="stat" style="text-align:center">누적 차감<b class="negative" style="font-size:23px">−${money(spent)}</b></div></div><div class="row" style="justify-content:space-between;margin-top:22px"><h3 style="margin:0">나의 코인 활동 기록</h3><select aria-label="월별 거래 선택" class="field" style="min-width:130px" onchange="window.walletSelectedMonth=this.value;render()"><option value="all">전체 기간</option>${months.map(m=>`<option value="${m}" ${month===m?'selected':''}>${m.replace('-','년 ')}월</option>`).join('')}</select></div><p class="muted">${visible.length}건의 기록 · 최신순</p>${items||'<div class="notice">해당 기간의 적립·차감 기록이 없습니다.</div>'}${visible.length>50?'<p class="muted">최근 50건만 표시합니다.</p>':''}<div class="notice" style="margin-top:20px">실제 휴대전화에서 조회하려면 서버 동기화 및 접근 권한 설정을 완료해야 합니다.</div></section>`;
}
function login(sid){let s=db.students.find(x=>x.id===sid);if(s&&$('pin-input').value===s.pin){studentSession=s.id;window.walletSelectedMonth='all';render()}else alert('비밀번호가 일치하지 않습니다.')}
function transactions(){return `<section class="panel"><h2>전체 거래 내역</h2><div class="row"><button class="outline" onclick="exportTx()">거래 CSV 다운로드</button></div><div style="overflow-x:auto"><table><thead><tr><th>시간</th><th>학생</th><th>사유</th><th>변동</th><th>변경 후</th><th>정정</th></tr></thead><tbody>${db.transactions.map(t=>{let s=db.students.find(x=>x.id===t.studentId);return `<tr><td>${new Date(t.at).toLocaleString('ko-KR')}</td><td>${s?fmt(s):'삭제된 학생'}</td><td>${esc(t.reason)}</td><td class="${t.amount>0?'success':'negative'}">${t.amount>0?'+':''}${t.amount}</td><td>${t.after}</td><td><button class="outline" onclick="reverseTx('${t.id}')">반대 거래</button></td></tr>`}).join('')}</tbody></table></div></section>`}function reverseTx(tid){let t=db.transactions.find(x=>x.id===tid),s=db.students.find(x=>x.id===t?.studentId);if(!t||!s)return;if(db.transactions.some(x=>x.reversalOf===tid))return alert('이미 정정된 거래입니다.');if(!confirm('해당 거래를 상쇄하는 반대 거래를 기록할까요?'))return;let r=transact(s,-t.amount,'거래 정정');if(r.error)return alert(r.error);db.transactions[0].reversalOf=tid;save();render()}function exportTx(){let lines=[['날짜','학생','사유','변동','이전잔액','이후잔액'],...db.transactions.map(t=>{let s=db.students.find(x=>x.id===t.studentId);return [t.at,s?`${s.grade}-${s.cls}-${s.num} ${s.name}`:'',t.reason,t.amount,t.before,t.after]})];download(new Blob(['\uFEFF'+lines.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'사회코인_거래내역.csv')}window.addEventListener('hashchange',()=>{studentSession=null;render()});render();
</script></body></html>
